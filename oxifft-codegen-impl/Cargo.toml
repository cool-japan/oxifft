[package]
name = "oxifft-codegen-impl"
description = "Internal codelet generation logic for OxiFFT (not a proc-macro; used by oxifft-codegen and benchmarks)"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/cool-japan/oxifft"
documentation = "https://docs.rs/oxifft-codegen-impl"
readme = "README.md"
rust-version.workspace = true
keywords = ["fft", "codegen", "proc-macro", "simd"]
# Not a proc-macro crate itself (see description above) — `procedural-macro-helpers`
# was copy-pasted from the sibling `oxifft-codegen` crate. This crate is plain
# codelet-generation *logic* consumed by both the proc-macro crate and benchmarks.
categories = ["development-tools", "algorithms"]
exclude = [
    "benches/",
    "tests/",
    "fuzz/",
    ".github/",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "TODO.md",
]

[lib]
name = "oxifft_codegen_impl"

[dependencies]
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[lints]
workspace = true

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
