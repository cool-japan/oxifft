[package]
name = "oxifft-codegen"
description = "Procedural macro crate for OxiFFT codelet generation"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/cool-japan/oxifft"
documentation = "https://docs.rs/oxifft-codegen"
readme = "README.md"
rust-version.workspace = true
keywords = ["fft", "codegen", "proc-macro", "simd"]
categories = ["development-tools::procedural-macro-helpers"]
exclude = [
    "benches/",
    "tests/",
    "fuzz/",
    ".github/",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "TODO.md",
]

[lib]
proc-macro = true

[dependencies]
oxifft-codegen-impl.workspace = true
proc-macro2.workspace = true
quote.workspace = true
syn.workspace = true

[features]
default = ["std"]
# Matches the `std` feature of the `oxifft` consumer crate. `gen_simd_codelet!`
# / `gen_dispatcher_codelet!` emit `#[cfg(feature = "std")]` around the
# std-only `is_x86_feature_detected!` runtime probe, falling back to the
# no_std-safe `cfg!(target_feature = ...)` compile-time check otherwise — this
# cfg is resolved against whichever crate *invokes* the macro, so this
# package's own `tests/*.rs` fixtures need the feature declared too (both so
# `unexpected_cfgs` stays quiet, and so they exercise the real runtime-probe
# path by default, matching how `oxifft` itself is built).
#
# This crate has no `std`-gated code or dependencies of its own — it is a
# pure codegen-selection flag forwarded into emitted code. Build with
# `--no-default-features` to verify/exercise the no_std `cfg!(target_feature)`
# fallback path that generated code takes inside a `#![no_std]` consumer.
std = []
# Matches the `avx512` feature of the `oxifft` consumer crate. The
# `gen_simd_codelet!` macro emits `#[cfg(feature = "avx512")]`, which is
# resolved against the crate that invokes the macro — so the codegen tests
# need this feature declared to avoid `unexpected_cfgs` warnings. Default-off;
# enable with `--features avx512` to compile and exercise the AVX-512 codelets.
avx512 = []

[dev-dependencies]
oxifft-codegen-impl.workspace = true
trybuild.workspace = true
num-traits.workspace = true
criterion.workspace = true
proc-macro2.workspace = true
quote.workspace = true

[[bench]]
name = "codegen_time_stub"
harness = false

[[bench]]
name = "codegen_time"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu"]
